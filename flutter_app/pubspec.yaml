name: bizai
description: BizAI - AI-Powered Business Operating System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  printing: ^5.12.0
  pdf: ^3.10.8
  file_picker: ^8.0.5
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
