name: Build APK

on:
  push:
    branches: [ arena/019ff50d-bizaiapk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: stable
      
      - name: Build APK
        run: |
          cd flutter_app
          flutter pub get
          flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BizAI-v1.1.2.apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
